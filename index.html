<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>The Scholar's Railway</title>
<meta name="theme-color" content="#0a0f26" />
<style>body{margin:0;background:#0a0f26}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ════════════════════════════════════════════════════════════════
   THE SCHOLAR'S RAILWAY — a PhD command station
   Night on the Galactic Railroad × Morrowind
   Standalone build: data persists in this browser (localStorage).
   ════════════════════════════════════════════════════════════════ */

const STORAGE_KEY = "scholars-railway-v1";

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --night:#0a0f26; --night2:#131a3a; --night3:#1c2450;
  --starlight:#aebdf5; --paleblue:#8fa7d9;
  --parch:#efe4c9; --parch2:#e2d1a7; --parch3:#d6c193;
  --ink:#3b2e1c; --ink2:#5c4a2e; --faded:#7d6a48;
  --brass:#b08d4f; --brass2:#caa45e; --brassdark:#7a5f33;
  --ember:#a5462f; --sage:#93b78a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100%}
body{
  background:
    radial-gradient(ellipse 90% 60% at 70% -10%, #202a5e 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 10% 100%, #17204a 0%, transparent 60%),
    linear-gradient(180deg, var(--night) 0%, #0d1330 55%, #0a0e22 100%);
  background-attachment:fixed;
  color:var(--parch);
  font-family:'EB Garamond', Georgia, serif;
  font-size:17px; line-height:1.45;
}
.app{position:relative;max-width:1080px;margin:0 auto;padding:14px 14px 90px;min-height:100vh}

/* ── Starfield ── */
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.milkyway{position:absolute;left:-20%;top:-10%;width:150%;height:60%;
  background:linear-gradient(100deg, transparent 20%, rgba(160,175,235,.10) 42%, rgba(220,225,250,.16) 50%, rgba(160,175,235,.10) 58%, transparent 80%);
  transform:rotate(-16deg);filter:blur(6px)}
.star{position:absolute;border-radius:50%;background:#e9ecff;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.star{animation:none;opacity:.6}}
.content{position:relative;z-index:1}

/* ── Masthead ── */
.masthead{text-align:center;padding:18px 8px 10px}
.masthead h1{font-family:Cinzel,serif;font-weight:700;font-size:clamp(22px,5vw,34px);
  letter-spacing:.14em;color:var(--brass2);
  text-shadow:0 0 22px rgba(202,164,94,.35), 0 2px 0 #000}
.masthead .sub{color:var(--paleblue);font-style:italic;font-size:15px;letter-spacing:.04em;margin-top:2px}
.mast-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}

/* ── Navigation: colored ticket tabs (desktop) / emblem dock (mobile) ── */
.nav{display:flex;gap:18px;flex-wrap:wrap;padding:8px 2px 10px;position:sticky;top:0;z-index:6;
  background:linear-gradient(180deg, rgba(10,15,38,.95), rgba(10,15,38,.85) 80%, transparent);backdrop-filter:blur(3px)}
.navgroup{display:flex;flex-direction:column;gap:4px}
.navlabel{font-family:Cinzel,serif;font-size:9.5px;letter-spacing:.24em;color:var(--paleblue);opacity:.8;padding-left:3px}
.navrow{display:flex;gap:6px;flex-wrap:wrap}
.nav button{
  font-family:Cinzel,serif;font-size:12px;font-weight:600;letter-spacing:.07em;cursor:pointer;
  padding:8px 12px;color:var(--parch2);white-space:nowrap;border-radius:3px;
  background:linear-gradient(180deg, var(--tcbg,#232b58), #141a3e);
  border:1px solid var(--brassdark);border-bottom:3px solid var(--tc,var(--brass));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 2px 6px rgba(0,0,0,.5)}
.nav button svg{color:var(--tc,var(--brass2))}
.nav button:hover{color:#fff;border-color:var(--tc,var(--brass))}
.nav button.on{
  background:linear-gradient(180deg,var(--tcon,#efe4c9),var(--tcon2,#e2d1a7));color:#2b2110;
  border-color:var(--tc,var(--brass2));
  box-shadow:0 0 16px var(--tcglow,rgba(202,164,94,.4)), inset 0 0 0 1px rgba(60,45,20,.3)}
.nav button.on svg{color:#3b2c14}
.lab-short{display:none}
@media(max-width:700px){
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;display:grid;grid-template-columns:repeat(9,1fr);
    gap:0;margin:0;padding:6px 3px calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,#090d20 72%,rgba(10,14,32,.97));border-top:1px solid var(--brassdark);
    box-shadow:0 -8px 22px rgba(0,0,0,.55);backdrop-filter:none}
  .navgroup,.navrow{display:contents}
  .navlabel{display:none}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:8px;letter-spacing:.03em;padding:5px 1px 4px;
    background:none;border:none;box-shadow:none;color:var(--paleblue);border-radius:6px}
  .nav button svg{width:20px;height:20px;margin:0}
  .nav button.on{background:none;color:var(--tc);text-shadow:0 0 10px var(--tcglow);
    box-shadow:inset 0 2px 0 var(--tc)}
  .nav button.on svg{color:var(--tc)}
  .lab-long{display:none}.lab-short{display:block}
  .app{padding-bottom:126px}
}
.nav button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--brass2);outline-offset:1px}

/* ── Parchment panels ── */
.panel{
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255,250,230,.5), transparent 55%),
    linear-gradient(165deg, var(--parch) 0%, var(--parch2) 70%, var(--parch3) 100%);
  color:var(--ink);border:1px solid var(--brassdark);border-radius:4px;
  box-shadow:0 0 0 3px #0e1330, 0 0 0 4px var(--ring,var(--brassdark)), 0 12px 34px rgba(0,0,0,.55);
  padding:16px;margin:16px 0;position:relative}
.panel::before{content:"";position:absolute;left:10px;right:10px;top:6px;height:1px;
  background:linear-gradient(90deg,transparent,var(--brass) 20%,var(--brass) 80%,transparent)}
.panel h2{font-family:Cinzel,serif;font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--brassdark);
  display:flex;align-items:center;gap:8px;margin:4px 0 4px}
.panel h2::after{content:"❖";font-size:11px;color:var(--brass)}
.panel h3{font-family:Cinzel,serif;font-size:14.5px;letter-spacing:.06em;color:var(--ink2);margin:14px 0 6px}
.panel .note{font-style:italic;color:var(--faded);font-size:14.5px}
.rule{border:none;height:1px;margin:12px 0;
  background:linear-gradient(90deg,transparent,var(--brass),transparent)}

/* ── Cards & lists ── */
.card{background:rgba(255,252,240,.55);border:1px solid #c4ad7d;border-radius:3px;
  padding:10px 12px;margin:8px 0;box-shadow:0 1px 3px rgba(59,46,28,.15)}
.card.dim{opacity:.62}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.title-line{font-weight:600;font-size:16.5px}
.meta{font-size:13.5px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}

/* ── Chips & badges ── */
.chip{display:inline-block;font-size:12px;font-family:Cinzel,serif;letter-spacing:.05em;
  padding:2px 8px;border-radius:2px;border:1px solid;line-height:1.5;white-space:nowrap}
.badge-days{font-size:12.5px;font-weight:600;padding:2px 7px;border-radius:2px;border:1px solid transparent}
.d-over{color:#fff;background:var(--ember);box-shadow:0 0 8px rgba(165,70,47,.6)}
.d-soon{color:#5c2314;background:#e0a35d;border-color:#a5764a}
.d-ok{color:var(--ink2);background:rgba(59,46,28,.08);border-color:#c4ad7d}
.d-done{color:#4b5d43;background:rgba(147,183,138,.35);border-color:#93b78a}

/* ── Buttons ── */
.btn{font-family:Cinzel,serif;font-size:12.5px;font-weight:600;letter-spacing:.06em;cursor:pointer;
  padding:7px 12px;border-radius:3px;color:#2c2005;
  background:linear-gradient(180deg,var(--brass2),var(--brass));
  border:1px solid var(--brassdark);box-shadow:inset 0 1px 0 rgba(255,240,200,.5), 0 2px 4px rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid #b39a68;box-shadow:none}
.btn.ghost:hover{background:rgba(176,141,79,.12)}
.btn.night{background:linear-gradient(180deg,#26305f,#181f47);color:var(--parch2);border-color:var(--brassdark)}
.btn.danger{background:linear-gradient(180deg,#b95b42,#96412c);color:#fff;border-color:#6e2f1f}
.btn.sm{padding:4px 8px;font-size:11px}
.linkrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.linkbtn{font-size:13.5px;text-decoration:none;color:#20305e;background:rgba(143,167,217,.22);
  border:1px solid #8fa7d9;border-radius:3px;padding:5px 10px}
.linkbtn:hover{background:rgba(143,167,217,.4)}

/* ── Forms ── */
input,select,textarea{
  font-family:'EB Garamond',Georgia,serif;font-size:15.5px;color:var(--ink);
  background:rgba(255,253,244,.75);border:1px solid #b39a68;border-radius:3px;
  padding:7px 9px;width:100%;box-shadow:inset 0 1px 3px rgba(59,46,28,.18)}
textarea{min-height:64px;resize:vertical}
.f{display:flex;flex-direction:column;gap:3px;flex:1 1 150px;min-width:0}
.f>span{font-size:12px;font-family:Cinzel,serif;letter-spacing:.06em;color:var(--ink2)}
.formgrid{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0;align-items:flex-end}
.checkline{display:flex;gap:9px;align-items:flex-start;padding:6px 4px;border-bottom:1px dashed #c4ad7d;cursor:pointer}
.checkline input{width:auto;margin-top:4px;flex:0 0 auto;accent-color:var(--brassdark)}
.checkline.done span{text-decoration:line-through;color:var(--faded)}

/* ── Progress bars ── */
.bar{height:12px;background:rgba(59,46,28,.16);border:1px solid #a8905e;border-radius:2px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,#8fa06a,var(--brass2));
  box-shadow:0 0 8px rgba(202,164,94,.5);transition:width .4s}

/* ── Station clock (dashboard countdown) ── */
.clock{width:190px;height:190px;margin:6px auto;border-radius:50%;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, #2a3468, var(--night2) 65%);
  border:3px solid var(--brass);
  box-shadow:0 0 0 6px #0e1330, 0 0 0 7px var(--brassdark), 0 0 34px rgba(174,189,245,.3), inset 0 0 26px rgba(0,0,0,.65)}
.clock .num{font-family:Cinzel,serif;font-size:52px;font-weight:700;color:var(--starlight);
  text-shadow:0 0 18px rgba(174,189,245,.8);line-height:1}
.clock .lbl{font-size:12.5px;letter-spacing:.14em;font-family:Cinzel,serif;color:var(--brass2);margin-top:6px;text-align:center}

/* ── The celestial railway (timeline) ── */
.rail{position:relative;padding-left:46px;margin-top:6px}
.rail::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:8px;
  background:
    repeating-linear-gradient(180deg, transparent 0 14px, rgba(59,46,28,.5) 14px 18px),
    linear-gradient(180deg,#9b8355,#6f5a34);
  border-left:2px solid #57431f;border-right:2px solid #57431f;border-radius:3px}
.station{position:relative;margin:14px 0}
.lamp{position:absolute;left:-39px;top:8px;width:22px;height:22px;border-radius:50%;
  border:2px solid #f4ead0;background:radial-gradient(circle at 40% 35%, #fff, var(--c,#caa45e) 60%);
  box-shadow:0 0 14px var(--c,#caa45e), 0 0 4px #fff}
.station.past .lamp{filter:grayscale(.7);box-shadow:none;opacity:.55}
.station.major .lamp{width:28px;height:28px;left:-42px;top:5px}
.ticket{border-left:4px solid var(--c,#caa45e)}

/* lock screen */
.lockwrap{max-width:430px;margin:8vh auto 0}
.lockkey{width:54px;height:54px;margin:4px auto 10px;display:block;color:var(--brass2);
  filter:drop-shadow(0 0 12px rgba(202,164,94,.5))}
.lockerr{color:#8a3020;font-size:14.5px;margin-top:6px;text-align:center}

/* misc */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-top:10px}
.stat{background:rgba(28,36,80,.85);border:1px solid var(--brassdark);border-radius:3px;
  color:var(--parch);text-align:center;padding:10px 6px}
.stat b{display:block;font-family:Cinzel,serif;font-size:24px;color:var(--brass2)}
.stat span{font-size:12.5px;letter-spacing:.05em;color:var(--paleblue)}
.empty{font-style:italic;color:var(--faded);padding:10px 4px}
.tagpill{display:inline-block;font-size:12.5px;background:rgba(143,167,217,.25);border:1px solid #8fa7d9;
  color:#2b3a68;border-radius:10px;padding:1px 8px;margin:2px 3px 0 0}
.warn{background:rgba(165,70,47,.14);border:1px solid var(--ember);border-radius:3px;
  padding:8px 10px;font-size:14.5px;color:#7a3220;margin:8px 0}
.kgroup{margin:14px 0}
.khead{font-family:Cinzel,serif;font-size:13px;letter-spacing:.09em;color:var(--ink2);
  border-bottom:2px solid var(--brass);padding-bottom:3px;display:flex;justify-content:space-between}
/* ── per-module identity ── */
.modbanner{display:flex;align-items:center;gap:13px;margin:14px 2px 0;color:var(--acc,#caa45e);
  padding:10px 13px;border-radius:4px;border-left:3px solid var(--acc,#caa45e);
  background:linear-gradient(90deg, var(--accbg,transparent), transparent 72%)}
.modbanner svg{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 0 9px var(--acc,#caa45e))}
.modname{font-family:Cinzel,serif;font-size:17px;font-weight:700;letter-spacing:.14em;color:var(--acc,#caa45e)}
.modtag{font-style:italic;color:var(--paleblue);font-size:14.5px}
.modwrap .panel{border-top:4px solid var(--acc,#caa45e)}
.modwrap .panel::after{content:var(--mark,"❖");position:absolute;right:13px;top:9px;font-size:48px;
  line-height:1;opacity:.13;color:var(--acc,#caa45e);pointer-events:none}
.modwrap .panel h2{color:var(--accdark,var(--brassdark))}
.modwrap .panel h2::after{color:var(--acc,#caa45e);filter:saturate(.7) brightness(.8)}
.modwrap .khead{border-bottom-color:var(--acc,var(--brass))}
.nav button svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.caut{background:rgba(165,70,47,.08);border-left:3px solid var(--ember);padding:6px 10px;margin:6px 0;font-size:15px}
.caut b{color:#7a3220}
@media(max-width:560px){
  .clock{width:160px;height:160px}.clock .num{font-size:42px}
  body{font-size:16px}
  .modbanner svg{width:34px;height:34px}
}
`;

/* ─── constants ─── */

const MODULES = [
  { id: "dashboard", label: "Dashboard", short: "Home" },
  { id: "thesis", label: "Thesis HQ", short: "Thesis" },
  { id: "timeline", label: "Timeline", short: "Rail" },
  { id: "jobs", label: "Jobs", short: "Jobs" },

const NAV_GROUPS = [

  Thesis: "#caa45e", Jobs: "#93b78a", Literature: "#8fa7d9",

};

  thesis: { acc: "#e0b264", mark: '"✒"', tag: "the manuscript — word by word to the last station" },
  timeline: { acc: "#aebdf5", mark: '"✧"', tag: "the celestial railway — every deadline on one track" },

const Emblem = ({ id }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"
    strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{EMBLEMS[id]}</svg>
);

const JOB_STATUSES = ["found", "applied", "interview", "offer", "rejected"];
const PUB_STATUSES = ["idea", "drafting", "submitted", "under review", "revisions", "accepted", "published"];
const TASK_STATUSES = ["todo", "doing", "blocked", "done"];
const CH_STATUSES = ["not started", "outlining", "drafting", "revising", "with supervisor", "done"];

const jobLinks = (kw, loc) => {
  const k = encodeURIComponent(kw), l = encodeURIComponent(loc);
  return [
    { name: "jobs.ac.uk", url: `https://www.jobs.ac.uk/search/?keywords=${k}&location=${l}` },
    { name: "THE unijobs", url: `https://www.timeshighereducation.com/unijobs/listings/?Keywords=${k}` },
    { name: "LinkedIn Jobs", url: `https://www.linkedin.com/jobs/search/?keywords=${k}&location=${encodeURIComponent(loc + ", England")}` },
    { name: "Indeed UK", url: `https://uk.indeed.com/jobs?q=${k}&l=${l}` },
    { name: "Salford on jobs.ac.uk", url: `https://www.jobs.ac.uk/search/?keywords=${encodeURIComponent("University of Salford " + kw)}` },
    { name: "Manchester unis", url: `https://www.jobs.ac.uk/search/?keywords=${k}&location=Manchester` },
  ];
};

const litLinks = (q) => {
  const k = encodeURIComponent(q);
  return [

const hexMix = (a, b, t) => {
  const h = (c) => c.replace("#", "");
  const A = h(a), B = h(b);
  const ch = (i) => Math.round(parseInt(A.slice(i, i + 2), 16) * (1 - t) + parseInt(B.slice(i, i + 2), 16) * t)
    .toString(16).padStart(2, "0");
  return "#" + ch(0) + ch(2) + ch(4);
};
const hexA = (hex, a) => {
  const h = hex.replace("#", "");
  return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`;
};

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const todayISO = () => new Date().toISOString().slice(0, 10);
const daysUntil = (iso) => {
  if (!iso) return null;
  const a = new Date(todayISO() + "T00:00:00"), b = new Date(iso + "T00:00:00");
  return Math.round((b - a) / 86400000);
};
const fmtDate = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
};
const icsEsc = (t) => String(t).replace(/\\/g, "\\\\").replace(/[,;]/g, (m) => "\\" + m).replace(/\n/g, "\\n");
function downloadICS(events) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Scholars Railway//EN", "CALSCALE:GREGORIAN"];
  events.forEach((e, i) => {
    const d = e.date.replace(/-/g, "");
    L.push("BEGIN:VEVENT",
      `UID:sr-${d}-${i}@scholars-railway`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d}`,
      `SUMMARY:${icsEsc("[" + e.module + "] " + e.title)}`,
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  const blob = new Blob([L.join("\r\n")], { type: "text/calendar" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "scholars-railway-deadlines.ics";
  a.click(); URL.revokeObjectURL(a.href);
}

const DaysBadge = ({ date, done }) => {
  if (done) return <span className="badge-days d-done">done ✓</span>;
  const n = daysUntil(date);
  if (n === null) return null;
  if (n < 0) return <span className="badge-days d-over">{-n}d overdue</span>;
  if (n === 0) return <span className="badge-days d-over">today</span>;
  if (n <= 14) return <span className="badge-days d-soon">{n}d left</span>;
  return <span className="badge-days d-ok">{n}d</span>;
};

function migrate(loaded) {
  const d = JSON.parse(JSON.stringify(DEFAULT_DATA));
  if (!loaded || typeof loaded !== "object") return d;
  for (const k of Object.keys(d)) {
    if (loaded[k] !== undefined) d[k] = typeof d[k] === "object" && !Array.isArray(d[k])
      ? { ...d[k], ...loaded[k] } : loaded[k];
  }
  return d;
}

function collectEvents(d) {
  const ev = [];
  d.thesis.chapters.forEach((c) => c.deadline && ev.push({
    date: c.deadline, title: "Chapter: " + c.title, module: "Thesis", done: c.status === "done" }));
  d.thesis.milestones.forEach((m) => m.date && ev.push({
    date: m.date, title: m.title, module: "Thesis", done: m.done }));
  ev.push({ date: d.settings.thesisDeadline, title: "THESIS SUBMISSION", module: "Thesis", major: true });
  d.jobs.items.forEach((j) => j.deadline && !["offer", "rejected"].includes(j.status) && ev.push({
    date: j.deadline, title: j.title + (j.org ? " — " + j.org : ""), module: "Jobs", done: j.status === "applied" || j.status === "interview" }));
  d.publications.forEach((p) => p.deadline && p.status !== "published" && ev.push({
    date: p.deadline, title: p.title, module: "Publications" }));
  d.projects.forEach((pr) => (pr.milestones || []).forEach((m) => m.date && ev.push({
    date: m.date, title: pr.name + ": " + m.title, module: "Projects", done: m.done })));
  d.gamedev.milestones.forEach((m) => m.date && ev.push({
    date: m.date, title: m.title, module: "GameDev", done: m.done }));
  d.gamedev.tasks.forEach((t) => t.due && t.status !== "done" && ev.push({
    date: t.due, title: t.title + (t.assignee ? " (" + t.assignee + ")" : ""), module: "GameDev" }));
  return ev.filter((e) => e.date).sort((a, b) => a.date.localeCompare(b.date));
}

   Data stays on this device unless the Gist cloud vault is connected. */
const SNAP_KEY = STORAGE_KEY + "-snaps";
const PASS_KEY = STORAGE_KEY + "-pass";
const SYNC_KEY = STORAGE_KEY + "-sync";
const storeGet = async () => {
  try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
};
const storeSet = async (v) => {
  try { localStorage.setItem(STORAGE_KEY, v); return true; } catch (e) { return false; }
};
const snapGet = async () => {
  try { const r = localStorage.getItem(SNAP_KEY); return r ? JSON.parse(r) : []; }
  catch (e) { return []; }
};
const snapSet = async (arr) => {
  try { localStorage.setItem(SNAP_KEY, JSON.stringify(arr)); } catch (e) {}
};
const passGet = async () => {

};
const passSet = async (v) => { try { localStorage.setItem(PASS_KEY, v); } catch (e) {} };

};
const syncCfgSet = async (v) => { try { localStorage.setItem(SYNC_KEY, v); } catch (e) {} };

/* ── GitHub Gist cloud vault (free, keyless server, user-owned) ── */
const GH_FILE = "scholars-railway.json";
const ghHeaders = (t) => ({ Authorization: "Bearer " + t, Accept: "application/vnd.github+json", "Content-Type": "application/json" });
async function gistCreate(token, content) {
  const r = await fetch("https://api.github.com/gists", {
    method: "POST", headers: ghHeaders(token),
    body: JSON.stringify({ description: "The Scholar's Railway — private data vault", public: false, files: { [GH_FILE]: { content } } }),
  });
  if (!r.ok) throw new Error("create " + r.status);
  return (await r.json()).id;
}
async function gistPull(token, id) {
  const r = await fetch("https://api.github.com/gists/" + encodeURIComponent(id), { headers: ghHeaders(token) });
  if (!r.ok) throw new Error("pull " + r.status);
  const f = (await r.json()).files[GH_FILE];
  if (!f) throw new Error("vault file missing");
  if (f.truncated) { const rr = await fetch(f.raw_url); return await rr.text(); }
  return f.content;
}
async function gistPush(token, id, content) {
  const r = await fetch("https://api.github.com/gists/" + encodeURIComponent(id), {
    method: "PATCH", headers: ghHeaders(token),
    body: JSON.stringify({ files: { [GH_FILE]: { content } } }),
  });
  if (!r.ok) throw new Error("push " + r.status);
}

function useAppData() {
  const [data, setData] = useState(null);
  const [storageOk, setStorageOk] = useState(true);
  const [sync, setSyncState] = useState(null);
  const [syncMsg, setSyncMsg] = useState("");
  const timer = useRef(null);
  const pushTimer = useRef(null);
  const loaded = useRef(false);

  const tsOf = (raw) => { try { return (JSON.parse(raw).meta || {}).updatedAt || 0; } catch (e) { return 0; } };

  useEffect(() => {
    (async () => {
      let cfg = null;
      try { const c = await syncCfgGet(); cfg = c ? JSON.parse(c) : null; } catch (e) {}
      setSyncState(cfg);
      let raw = null;
      try { raw = await storeGet(); } catch (e) {}
      let chosen = raw;
      if (cfg && cfg.token && cfg.gistId) {
        try {
          setSyncMsg("pulling from cloud…");
          const remote = await gistPull(cfg.token, cfg.gistId);
          if (remote && tsOf(remote) >= tsOf(raw)) {
            chosen = remote;
            try { await storeSet(remote); } catch (e) {}
          } else if (raw) {
            try { await gistPush(cfg.token, cfg.gistId, raw); } catch (e) {}
          }
          setSyncMsg("cloud synced");
        } catch (e) { setSyncMsg("cloud unreachable — working locally"); }
      }
      setData(migrate(chosen ? JSON.parse(chosen) : null));
      if (chosen) { // keep the last 5 session-start states as restore points
        const snaps = await snapGet();
        if (!snaps[0] || snaps[0].raw !== chosen) {
          snaps.unshift({ ts: Date.now(), raw: chosen });
          await snapSet(snaps.slice(0, 5));
        }
      }
      loaded.current = true;
    })();
  }, []);

  useEffect(() => {
    if (!loaded.current || data === null) return;
    clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      const payload = JSON.stringify(data);
      try { setStorageOk(await storeSet(payload)); } catch (e) { setStorageOk(false); }
      if (sync && sync.token && sync.gistId) {
        clearTimeout(pushTimer.current);
        pushTimer.current = setTimeout(async () => {
          try {
            await gistPush(sync.token, sync.gistId, payload);
            setSyncMsg("synced " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }));
          } catch (e) { setSyncMsg("cloud push failed — data safe locally"); }
        }, 3500);
      }
    }, 700);
    return () => clearTimeout(timer.current);
  }, [data, sync]);

  const saveCfg = async (cfg) => {
    setSyncState(cfg);
    try { await syncCfgSet(cfg ? JSON.stringify(cfg) : ""); } catch (e) {}
  };
  const createVault = async (token) => {
    const id = await gistCreate(token, JSON.stringify(data));
    await saveCfg({ token, gistId: id });
    setSyncMsg("vault created");
    return id;
  };
  const connectVault = async (token, gistId) => {
    const remote = await gistPull(token, gistId);
    const local = JSON.stringify(data);
    if (remote && tsOf(remote) >= tsOf(local)) setData(migrate(JSON.parse(remote)));
    else await gistPush(token, gistId, local);
    await saveCfg({ token, gistId });
    setSyncMsg("vault connected");
  };
  const pullNow = async () => {
    if (!sync) return;
    setSyncMsg("pulling…");
    const remote = await gistPull(sync.token, sync.gistId);
    setData(migrate(JSON.parse(remote)));
    setSyncMsg("pulled from cloud");
  };
  const disconnect = async () => { await saveCfg(null); setSyncMsg(""); };

  return [data, setData, storageOk, { sync, syncMsg, createVault, connectVault, pullNow, disconnect }];
}

const b64ToBuf = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
async function unlockKnowledge(pass) {
  try {
    const raw = b64ToBuf(KNOWLEDGE_ENC);
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" }, km,
      { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    KNOWLEDGE = JSON.parse(new TextDecoder().decode(pt));
    return true;
  } catch (e) { return false; }
}

/* ════════════════ LITERATURE ════════════════ */

function bibEntry(e) {
  const first = (e.authors || "ref").split(/[,;&]| and /)[0].trim().split(" ").pop() || "ref";
  const key = (first + (e.year || "")).toLowerCase().replace(/[^a-z0-9]/g, "");
  const type = e.type === "book" ? "book" : e.type === "chapter" ? "incollection" : e.type === "article" ? "article" : "misc";
  const lines = [`@${type}{${key},`, `  author = {${e.authors || ""}},`, `  title = {${e.title || ""}},`, `  year = {${e.year || ""}},`];
  if (type === "article") lines.push(`  journal = {${e.venue || ""}},`);
  else if (type === "incollection") lines.push(`  booktitle = {${e.venue || ""}},`);
  else if (e.venue) lines.push(`  publisher = {${e.venue}},`);
  if (e.link) lines.push(`  url = {${e.link}},`);
  lines.push(`}`);
  return lines.join("\n");
}

function Literature({ d, up }) {
  const blank = { authors: "", year: "", title: "", venue: "", type: "article", tags: "", notes: "", link: "", feeds: "" };
  const [form, setForm] = useState(blank);
  const [editId, setEditId] = useState(null);
  const [q, setQ] = useState("");
  const [searchQ, setSearchQ] = useState("video games ideology identity propaganda");
  const [copied, setCopied] = useState(false);
  const [doi, setDoi] = useState("");
  const [doiState, setDoiState] = useState("");

  const fetchDoi = async () => {
    const clean = doi.trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, "");
    if (!clean) return;
    setDoiState("fetching…");
    try {
      const res = await fetch("https://api.crossref.org/works/" + encodeURIComponent(clean));
      if (!res.ok) throw new Error(String(res.status));
      const w = (await res.json()).message;
      const typeMap = { "journal-article": "article", "book": "book", "book-chapter": "chapter", "proceedings-article": "article", "monograph": "book" };
      setForm({
        ...blank,
        authors: (w.author || []).map((a) => (a.family ? a.family + (a.given ? ", " + a.given : "") : a.name || "")).filter(Boolean).join("; "),
        year: String((w.issued && w.issued["date-parts"] && w.issued["date-parts"][0] && w.issued["date-parts"][0][0]) || ""),
        title: (w.title && w.title[0]) || "",
        venue: (w["container-title"] && w["container-title"][0]) || w.publisher || "",
        type: typeMap[w.type] || "other",
        link: w.URL || "https://doi.org/" + clean,
      });
      setEditId(null);
      setDoiState("✓ fetched — review below, then add");
    } catch (e) {
      setDoiState("couldn't fetch — check the DOI, or this environment may block external requests (the standalone build fetches fine); fill in manually");
    }
  };

  const list = d.literature.filter((e) => {
    if (!q) return true;
    const hay = (e.authors + " " + e.title + " " + e.tags + " " + e.notes + " " + e.feeds + " " + e.venue).toLowerCase();
    return q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
  });

  const save = () => {
    if (!form.title) return;
    up((x) => {
      if (editId) {
        const i = x.literature.findIndex((e) => e.id === editId);
        if (i > -1) x.literature[i] = { ...x.literature[i], ...form };
      } else x.literature.unshift({ id: uid(), ...form });
    });
    setForm(blank); setEditId(null);
  };

  const exportBib = () => {
    const bib = d.literature.map(bibEntry).join("\n\n");
    const blob = new Blob([bib], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "library.bib"; a.click();
    URL.revokeObjectURL(a.href);
  };
  const copyBib = async () => {
    try { await navigator.clipboard.writeText(d.literature.map(bibEntry).join("\n\n"));
      setCopied(true); setTimeout(() => setCopied(false), 1600); } catch (e) {}
  };

  return (
    <>
      <Panel title="Search the archives">
        <div className="formgrid">
          <label className="f"><span>Query</span><input value={searchQ} onChange={(e) => setSearchQ(e.target.value)} /></label>
        </div>
        <div className="linkrow">{litLinks(searchQ).map((s) => <LinkOut key={s.name} url={s.url}>{s.name} ↗</LinkOut>)}</div>
      </Panel>

      <Panel title={`The vault — ${d.literature.length} works`} aside={
        <div className="row">
          <button className="btn ghost sm" onClick={copyBib}>{copied ? "copied ✓" : "copy BibTeX"}</button>
          <button className="btn ghost sm" onClick={exportBib}>download .bib</button>
        </div>}>
        <div className="formgrid">
          <label className="f"><span>Filter vault</span><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="tag, author, chapter…" /></label>
        </div>
        {list.map((e) => (
          <div key={e.id} className="card">
            <div className="row">
              <div className="grow">
                <div className="title-line">{e.title}</div>
                <div className="meta">{e.authors} ({e.year}) · <i>{e.venue}</i> · {e.type}</div>
              </div>
              <LinkOut url={e.link} />
            </div>
            {e.notes && <p style={{ marginTop: 5, fontSize: 15 }}>{e.notes}</p>}
            <div>
              {e.tags && e.tags.split(",").map((t) => t.trim()).filter(Boolean).map((t) => <span key={t} className="tagpill">{t}</span>)}
              {e.feeds && <span className="tagpill" style={{ background: "rgba(202,164,94,.3)", borderColor: "#b08d4f", color: "#5c4a2e" }}>→ {e.feeds}</span>}
            </div>
            <div className="linkrow">

          "Track your absences from the UK from now on (a simple spreadsheet of trips): settlement applications use rolling 180-days-in-any-12-months limits, and reconstructing travel history years later is miserable. For Global Talent researchers, trips abroad FOR RESEARCH are exempt — keep evidence of the research purpose of each trip.",
          "Never let permission lapse: an in-time application extends your stay while it's decided; a gap of even a day can poison the continuous-residence record.",

            {TASK_STATUSES.map((s) => <option key={s}>{s}</option>)}</select></label>
          <label className="f" style={{ flex: "0 0 150px" }}><span>Due</span><input type="date" value={tform.due} onChange={(e) => setTform({ ...tform, due: e.target.value })} /></label>
          <label className="f" style={{ flexBasis: "100%" }}><span>Notes</span><textarea value={tform.notes} onChange={(e) => setTform({ ...tform, notes: e.target.value })} /></label>
          <button className="btn" onClick={saveTask}>{editId ? "Save changes" : "Add task"}</button>
          {editId && <button className="btn ghost" onClick={() => { setTform(blankT); setEditId(null); }}>cancel</button>}
        </div>
      </Panel>

      <Panel title="Milestones">
        {d.gamedev.milestones.sort((a, b) => (a.date || "").localeCompare(b.date || "")).map((m) => (
          <label key={m.id} className={"checkline" + (m.done ? " done" : "")}>
            <input type="checkbox" checked={!!m.done}
              onChange={() => up((x) => { const t = x.gamedev.milestones.find((y) => y.id === m.id); if (t) t.done = !t.done; })} />
            <span className="grow">{m.title}</span>
            <span className="meta">{fmtDate(m.date)}</span>
            <DaysBadge date={m.date} done={m.done} />
            <button className="btn ghost sm" onClick={(e) => { e.preventDefault(); up((x) => { x.gamedev.milestones = x.gamedev.milestones.filter((y) => y.id !== m.id); }); }}>✕</button>
          </label>
        ))}
        <div className="formgrid">
          <label className="f"><span>Milestone</span><input value={ms.title} onChange={(e) => setMs({ ...ms, title: e.target.value })} placeholder="Vertical slice / demo build" /></label>
          <label className="f" style={{ flex: "0 0 150px" }}><span>Date</span><input type="date" value={ms.date} onChange={(e) => setMs({ ...ms, date: e.target.value })} /></label>
          <button className="btn" onClick={() => { if (!ms.title || !ms.date) return;
            up((x) => { x.gamedev.milestones.push({ id: uid(), ...ms, done: false }); }); setMs({ title: "", date: "" }); }}>Add</button>
        </div>
      </Panel>
      <Knowledge id="gamedev" />
    </>
  );
}

/* ════════════════ APP ROOT ════════════════ */

function App() {
  const [data, setData, storageOk, cloud] = useAppData();
  const [tab, setTab] = useState("dashboard");
  const fileRef = useRef(null);
  const [snaps, setSnaps] = useState(null); // null = closed, [] = open
  const [locked, setLocked] = useState(true);
  const [booted, setBooted] = useState(false);
  const [passIn, setPassIn] = useState("");
  const [passErr, setPassErr] = useState("");
  const [showSync, setShowSync] = useState(false);
  const [tokenIn, setTokenIn] = useState("");
  const [gistIn, setGistIn] = useState("");
  const [syncBusy, setSyncBusy] = useState(false);

  useEffect(() => {
    (async () => {
      const saved = await passGet();
      if (saved && (await unlockKnowledge(saved))) setLocked(false);
      setBooted(true);
    })();
  }, []);

  const tryUnlock = async () => {
    setPassErr("");
    if (await unlockKnowledge(passIn.trim())) {
      await passSet(passIn.trim());
      setLocked(false); setPassIn("");
    } else setPassErr("The lamps stay dark — that passphrase doesn't open this carriage.");
  };

  const toggleHistory = async () => {
    if (snaps) { setSnaps(null); return; }
    setSnaps(await snapGet());
  };
  const restoreSnap = (sn) => {
    if (!window.confirm("Restore the state from " + new Date(sn.ts).toLocaleString("en-GB") + "? Current data will be replaced (a snapshot of it is kept).")) return;
    try { setData(migrate(JSON.parse(sn.raw))); setSnaps(null); }
    catch (e) { alert("That snapshot could not be read."); }
  };

  const up = (fn) => setData((prev) => { const next = JSON.parse(JSON.stringify(prev)); fn(next); next.meta = { updatedAt: Date.now() }; return next; });

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "scholars-railway-backup-" + todayISO() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  const importJSON = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const d = migrate(JSON.parse(r.result)); d.meta = { updatedAt: Date.now() }; setData(d); } catch (err) { alert("That file could not be read as a backup. Choose a JSON file exported from this app."); } };
    r.readAsText(f);
    e.target.value = "";
  };

  if (!data) return (
    <div className="app"><style>{CSS}</style><Starfield />
      <div className="content masthead"><h1>THE SCHOLAR'S RAILWAY</h1>
        <p className="sub">lighting the lamps…</p></div>
    </div>
  );

  if (!booted) return (
    <div className="app"><style>{CSS}</style><Starfield />
      <div className="content masthead"><h1>THE SCHOLAR'S RAILWAY</h1>
        <p className="sub">lighting the lamps…</p></div>
    </div>
  );

  if (locked) return (
    <div className="app">
      <style>{CSS}</style>
      <Starfield />
      <div className="content">
        <header className="masthead">
          <h1>THE SCHOLAR'S RAILWAY</h1>
          <p className="sub">a private carriage — night service</p>
        </header>
        <div className="panel lockwrap">
          <svg className="lockkey" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"
            strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="1.5" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            <circle cx="12" cy="14.5" r="1.4" /><path d="M12 15.9v1.8" />
          </svg>
          <h2 style={{ justifyContent: "center" }}>The door is locked</h2>
          <p className="note" style={{ textAlign: "center" }}>Enter the passphrase to board.</p>
          <div className="formgrid" style={{ justifyContent: "center" }}>
            <label className="f" style={{ maxWidth: 260 }}><span>Passphrase</span>
              <input type="password" value={passIn} autoFocus
                onChange={(e) => setPassIn(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && tryUnlock()} /></label>
            <button className="btn" onClick={tryUnlock}>Unlock</button>
          </div>
          {passErr && <p className="lockerr">{passErr}</p>}
        </div>
      </div>
    </div>
  );

  const days = daysUntil(data.settings.thesisDeadline);
  const M = { dashboard: Dashboard, thesis: Thesis, timeline: Timeline, jobs: Jobs,
    literature: Literature, publications: Publications, visa: Visa, projects: Projects, gamedev: GameDev }[tab];

  return (
    <div className="app">
      <style>{CSS}</style>
      <Starfield />
      <div className="content">
        <header className="masthead">
          <h1>THE SCHOLAR'S RAILWAY</h1>
          <p className="sub">night service between Salford and the stars · {days} days to submission</p>
          <div className="mast-tools">
            <button className="btn night sm" onClick={exportJSON}>⬇ export backup</button>
            <button className="btn night sm" onClick={() => fileRef.current && fileRef.current.click()}>⬆ import backup</button>
            <button className="btn night sm" onClick={toggleHistory}>{snaps ? "✕ close history" : "🕰 history"}</button>
            <button className="btn night sm" onClick={() => setShowSync(!showSync)}>{showSync ? "✕ close sync" : "☁ sync"}</button>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{ display: "none" }} onChange={importJSON} />
          </div>
          {snaps && <div className="panel" style={{ maxWidth: 620, margin: "12px auto", textAlign: "left" }}>
            <h2>Restore points</h2>
            <p className="note">The app keeps the state from your last five sessions. Restoring replaces current data (which itself becomes a snapshot next session). Exports remain your deep backup.</p>
            {snaps.length === 0 && <p className="empty">No snapshots yet — they appear from your next visit onward.</p>}
            {snaps.map((sn, i) => (
              <div key={i} className="card row">
                <div className="grow">
                  <div className="title-line">{new Date(sn.ts).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}</div>
                  <div className="meta">{Math.round(sn.raw.length / 1024)} KB{i === 0 ? " · most recent" : ""}</div>
                </div>
                <button className="btn sm" onClick={() => restoreSnap(sn)}>restore</button>
              </div>
            ))}
          </div>}
          {showSync && <div className="panel" style={{ maxWidth: 660, margin: "12px auto", textAlign: "left" }}>
            <h2>Cloud vault — sync via GitHub Gist</h2>
            {cloud.sync ? (
              <>
                <p className="note">This device is connected to your private vault. {cloud.syncMsg && <b>Status: {cloud.syncMsg}.</b>} Changes push automatically a few seconds after you make them.</p>
                <div className="card row">
                  <div className="grow">
                    <div className="meta">Vault ID — you'll need this (plus the same token) on your other devices</div>
                    <div className="title-line" style={{ fontSize: 14.5, wordBreak: "break-all" }}>{cloud.sync.gistId}</div>
                  </div>
                  <button className="btn ghost sm" onClick={() => { try { navigator.clipboard.writeText(cloud.sync.gistId); } catch (e) {} }}>copy</button>
                </div>
                <div className="linkrow">
                  <button className="btn sm" onClick={async () => { try { await cloud.pullNow(); } catch (e) { alert("Pull failed — check your connection and token."); } }}>⟲ pull latest from cloud</button>
                  <button className="btn ghost sm" onClick={() => { if (window.confirm("Disconnect this device from the vault? Your data stays; only syncing stops.")) cloud.disconnect(); }}>disconnect this device</button>
                </div>
              </>
            ) : (
              <>
                <p className="note">One private file on GitHub becomes your database — every device reads and writes it. Free forever, no servers, and you never need to learn Git. Setup is a one-time ritual per device:</p>
                <ol style={{ paddingLeft: 20 }}>
                  <li style={{ margin: "6px 0" }}>Create a free account at <b>github.com</b> — an ordinary email sign-up, nothing more.</li>
                  <li style={{ margin: "6px 0" }}>Get your key: github.com → your avatar → <b>Settings</b> → <b>Developer settings</b> (bottom of the left menu) → <b>Personal access tokens → Tokens (classic)</b> → <b>Generate new token (classic)</b>. Name it "railway", set Expiration to <b>No expiration</b>, tick <b>only the "gist" checkbox</b>, press Generate, and copy the code that starts with <b>ghp_</b> (it's shown once).</li>
                  <li style={{ margin: "6px 0" }}>Paste the token below. On your <b>first</b> device press <b>Create cloud vault</b>. On every <b>other</b> device paste the same token <b>and</b> the Vault ID (shown after creation), then press <b>Connect</b>.</li>
                </ol>
                <div className="formgrid">
                  <label className="f"><span>GitHub token</span><input type="password" value={tokenIn} onChange={(e) => setTokenIn(e.target.value)} placeholder="ghp_…" /></label>
                  <label className="f"><span>Vault ID (only when connecting to an existing vault)</span><input value={gistIn} onChange={(e) => setGistIn(e.target.value)} placeholder="leave empty on first device" /></label>
                </div>
                <div className="linkrow">
                  <button className="btn" disabled={syncBusy} onClick={async () => {
                    const t = tokenIn.trim(); if (!t) return;
                    setSyncBusy(true);
                    try {
                      if (gistIn.trim()) await cloud.connectVault(t, gistIn.trim());
                      else await cloud.createVault(t);
                      setTokenIn(""); setGistIn("");
                    } catch (e) {
                      alert("Couldn't reach GitHub. Check the token (must have the gist scope) and the Vault ID. Note: the Claude artifact sandbox may block external requests — the standalone build syncs without restriction.");
                    }
                    setSyncBusy(false);
                  }}>{gistIn.trim() ? "Connect to vault" : "Create cloud vault"}</button>
                </div>
                <p className="meta" style={{ marginTop: 8 }}>The token is remembered on this device only, and can touch nothing on GitHub except gists. Don't enter it on shared computers. Sync is last-write-wins — avoid editing on two devices at the same moment.</p>
              </>
            )}
          </div>}
          {!storageOk && <div className="warn" style={{ maxWidth: 560, margin: "10px auto" }}>
            Saving to cloud storage is unavailable right now — your changes live only in this window. Export a backup before closing.</div>}
        </header>
        <nav className="nav" aria-label="Modules">
          {NAV_GROUPS.map((g) => (
            <div className="navgroup" key={g.label}>
              <span className="navlabel">{g.label}</span>
              <div className="navrow">
                {g.ids.map((id) => {
                  const m = MODULES.find((x) => x.id === id), t = THEMES[id];
                  return (
                    <button key={id} className={tab === id ? "on" : ""} onClick={() => setTab(id)}
                      style={{
                        "--tc": t.acc,
                        "--tcglow": hexA(t.acc, 0.45),
                        "--tcbg": hexMix(t.acc, "#161d42", 0.82),
                        "--tcon": hexMix(t.acc, "#efe4c9", 0.68),
                        "--tcon2": hexMix(t.acc, "#dcc9a0", 0.7),
                      }}>
                      <Emblem id={id} /><span className="lab-long">{m.label}</span><span className="lab-short">{m.short}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </nav>
        <div className="modbanner" style={{ "--acc": THEMES[tab].acc, "--accbg": hexA(THEMES[tab].acc, 0.14) }}>
          <Emblem id={tab} />
          <div>
            <div className="modname">{MODULES.find((m) => m.id === tab).label.toUpperCase()}</div>
            <div className="modtag">{THEMES[tab].tag}</div>
          </div>
        </div>
        <main className="modwrap" style={{
          "--acc": THEMES[tab].acc, "--mark": THEMES[tab].mark,
          "--ring": hexMix(THEMES[tab].acc, "#4a381f", 0.42),
          "--accdark": hexMix(THEMES[tab].acc, "#3f2f16", 0.48),
        }}>
          <M d={data} up={up} goto={setTab} />
        </main>
        <footer style={{ textAlign: "center", marginTop: 26, color: "var(--paleblue)", fontStyle: "italic", fontSize: 14 }}>
          “We'll travel on and on, but where the real heaven is, we must find for ourselves.”
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
